title: SSH Failed Password Event
name: ssh_failed_password
status: experimental
description: Detects a failed SSH password authentication event on Linux.

logsource:
  product: linux
  service: sshd

detection:
  selection:
    message|contains: "Failed password"
  condition: selection

---

title: Multiple SSH Failed Password Attempts
status: experimental
description: Detects multiple failed SSH password attempts within a short time window.

correlation:
  type: event_count
  rules:
    - ssh_failed_password
  group-by:
    - source_ip
  timespan: 1m
  condition:
    gte: 5

falsepositives:
  - Legitimate user repeatedly entering an incorrect password
  - Administrative testing in a lab environment

level: medium

tags:
  - attack.credential-access
  - attack.t1110.001
