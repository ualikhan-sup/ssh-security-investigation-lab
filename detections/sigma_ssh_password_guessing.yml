title: SSH Password Guessing
id: 8c1c9e9a-6e65-4d1b-8f0f-ssh-password-guessing
status: experimental
description: Detects repeated failed SSH authentication attempts that may indicate password guessing.

logsource:
  product: linux
  service: sshd

detection:
  selection:
    message|contains: "Failed password"
  condition: selection

falsepositives:
  - Legitimate user entering an incorrect password multiple times
  - Administrative testing in a lab environment

level: medium

tags:
  - attack.credential-access
  - attack.t1110.001
